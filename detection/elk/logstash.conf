input {
  file {
    path => "/logs/app/banking_app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => multiline {
      pattern => "^%{TIMESTAMP_ISO8601}"
      negate => true
      what => "previous"
    }
  }
}

filter {
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{LOGLEVEL:level} - %{GREEDYDATA:event} - USER:%{WORD:username} - IP:%{IP:source_ip}" }
  }
  
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Extract query details
  if [event] =~ "DATABASE_QUERY" or [event] =~ "SEARCH_QUERY" {
    grok {
      match => { "event" => "Rows: %{NUMBER:rows_returned}" }
    }
    mutate {
      convert => { "rows_returned" => "integer" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "banking-logs-%{+YYYY.MM.dd}"
  }
  
  stdout { codec => rubydebug }
}