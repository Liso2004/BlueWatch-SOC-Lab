version: '3.8'

services:
  banking-app:
    build: ./insider-threat-lab/app
    container_name: banking-app
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bank-network
    volumes:
      - ./insider-threat-lab/logs/app:/var/log/app
    environment:
      DB_HOST: mysql
      DB_USER: bankapp
      DB_PASSWORD: BankApp123!
      DB_NAME: banking

  mysql:
    image: mysql:8.0
    container_name: banking-db
    environment:
      MYSQL_ROOT_PASSWORD: Liso1707
      MYSQL_DATABASE: banking
      MYSQL_USER: bankapp
      MYSQL_PASSWORD: BankApp123!
    networks:
      - bank-network
    volumes:
      - mysql-data:/var/lib/mysql
      - ./insider-threat-lab/app/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pLiso1707"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - bank-network
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - bank-network
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - bank-network
    volumes:
      # Mount host logs so Logstash can read them
      - ./insider-threat-lab/logs:/logs
      # Mount the pipeline config
      - ./detection/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf

  wazuh:
    image: wazuh/wazuh-manager:4.7.0
    container_name: wazuh-manager
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    networks:
      - bank-network
    volumes:
      - ./detection/wazuh:/var/ossec/etc
      - wazuh-data:/var/ossec/data

networks:
  bank-network:
    driver: bridge

volumes:
  mysql-data:
  es-data:
  wazuh-data:
