version: "3.8"

services:
  banking-app:
    build: ./insider-threat-lab/app
    container_name: banking-app
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bank-network
    volumes:
      - ./insider-threat-lab/logs/app:/var/log/app
      # NVD responses cached for 24 h; warm from the host with: python -m mobile_risk.nvd 13.0
      - ./insider-threat-lab/nvd_cache:/var/cache/bluewatch-nvd
      # BlueWatch Mobile audit trail and analyst feedback (SQLite)
      - ./insider-threat-lab/bluewatch_data:/var/lib/bluewatch
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      MOBILE_RISK_DB: /var/lib/bluewatch/bluewatch_mobile.db
      MOBILE_RISK_THRESHOLD: ${MOBILE_RISK_THRESHOLD:-}
      BLUEWATCH_API_KEYS: ${BLUEWATCH_API_KEYS:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # Free local model on the host machine (AI_PROVIDER=ollama)
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      DB_HOST: ${DB_HOST:-mysql}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-banking}
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_CACHE_DIR: /var/cache/bluewatch-nvd

  mysql:
    image: mysql:8.0
    container_name: banking-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - bank-network
    volumes:
      - mysql-data:/var/lib/mysql
      - ./insider-threat-lab/app/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - bank-network
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - bank-network
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - bank-network
    volumes:
      - ./insider-threat-lab/logs:/logs
      - ./detection/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf

  wazuh:
    image: wazuh/wazuh-manager:4.7.0
    container_name: wazuh-manager
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    networks:
      - bank-network
    volumes:
      - ./detection/wazuh:/var/ossec/etc
      - wazuh-data:/var/ossec/data

networks:
  bank-network:
    driver: bridge

volumes:
  mysql-data:
  es-data:
  wazuh-data: