<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BlueWatch — {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bluewatch.css') }}">
</head>
<body>
<div class="shell">
    <header class="topnav">
        <a class="logo" href="/security"><span class="mark" aria-hidden="true"></span>BlueWatch</a>
        <nav aria-label="Security Center">
            <a href="/security" class="{{ 'active' if active == 'overview' }}">Overview</a>
            <a href="/security/incidents" class="{{ 'active' if active == 'incidents' }}">Incidents<span class="count" id="nav-open" hidden></span></a>
            <a href="/mobile-risk" class="{{ 'active' if active == 'apprisk' }}">Android app risk</a>
            <a href="/mobile-risk#vulns">Phone vulnerabilities</a>
            <a href="http://localhost:5601" target="_blank" rel="noopener">Raw logs ↗</a>
        </nav>
        <div class="right">
            <a class="btn ghost sm" href="/dashboard">SecureBank app</a>
            <a class="btn ghost sm" href="/logout">Sign out</a>
            <span class="avatar" title="Signed in as {{ username }}">{{ username[:2] }}</span>
        </div>
    </header>
    <main class="main">
        {% block main %}{% endblock %}
    </main>
</div>
<nav class="mobile-tabs" aria-label="Security Center">
    <a href="/security" class="{{ 'active' if active == 'overview' }}">Overview</a>
    <a href="/security/incidents" class="{{ 'active' if active == 'incidents' }}">Incidents<span class="count" id="nav-open-m" hidden></span></a>
    <a href="/mobile-risk" class="{{ 'active' if active == 'apprisk' }}">App risk</a>
    <a href="/dashboard">Bank app</a>
</nav>
<div id="tip" role="tooltip"></div>
<script src="{{ url_for('static', filename='js/bw.js') }}"></script>
<script>
    api('/api/soc/overview').then(o => {
        const n = o.incidents.open;
        for (const el of [document.getElementById('nav-open'), document.getElementById('nav-open-m')])
            if (n) { el.textContent = n; el.hidden = false; el.title = n + ' open incidents'; }
    }).catch(() => {});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
