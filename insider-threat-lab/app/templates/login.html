{% extends "bank_base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<header class="phone-top">
    <a href="/" style="color:#d6ebf5;text-decoration:none">← Back</a>
    <h1 style="margin-top:1rem">Staff sign in</h1>
    <p>SecureBank employees only</p>
</header>
<main class="phone-body">
    <form method="POST" class="card" autocomplete="off">
        {% if error %}<p class="notice" role="alert">{{ error }}</p>{% endif %}
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required autofocus>
        <label for="password" style="margin-top:.8rem">Password</label>
        <input id="password" type="password" name="password" required>
        <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:1rem">Sign in</button>
    </form>
    <p class="muted small" style="text-align:center;margin-top:1rem">Lab accounts: <code>analyst</code>,
        <code>jdoe</code> or <code>admin</code> · password <code>password123</code></p>
</main>
{% endblock %}
